<!-- The Authority's mark: nine territories, and a boundary drawn through
     them. Two islands fall inside the current definition and are lit; the
     rest are the same land, excluded by the same map. No text, so nothing
     here depends on the viewer's fonts and this file is committed as
     written rather than generated. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="An archipelago with some islands inside the current definition and some outside it">
  <rect width="64" height="64" fill="#07161C"/>
  <!-- excluded land -->
  <g fill="#31444A">
    <path d="M12 40 l7-4 6 3 -1 7 -8 3 -5-4 z"/>
    <path d="M40 44 l6-2 4 4 -3 5 -6 0 -2-4 z"/>
    <path d="M11 20 l5-3 4 3 -1 5 -6 1 -3-3 z"/>
  </g>
  <!-- inside the current definition -->
  <g fill="#FF7A5C">
    <path d="M30 12 l9-3 6 5 -2 9 -9 3 -6-6 z"/>
    <path d="M28 28 l7 1 2 6 -5 4 -6-2 -1-6 z"/>
  </g>
  <!-- the boundary itself -->
  <path d="M4 33 L60 23" stroke="#EFE6D3" stroke-width="1.6" stroke-dasharray="4 3" fill="none" opacity=".75"/>
</svg>
